name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: Experience.Api.csproj
  APP_PORT: '8080'
  REMOTE_DIR: /opt/experience-api

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }} -r linux-x64

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Publish (self-contained linux-x64)
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          --configuration Release
          -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          --no-restore
          --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-publish
          path: ./publish

  deploy:
    needs: build
    # push 到 main 或手动 Run workflow（在 main 上）时部署，PR 只构建
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOST: ${{ secrets.HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-publish
          path: ./publish

      - name: Check SSH config
        id: check
        run: |
          if [ -z "$HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 HOST / SSH_USER / SSH_PRIVATE_KEY secret，已跳过部署。配置后重新运行本工作流即可。"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH key
        if: steps.check.outputs.available == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Deploy to Aliyun ECS
        if: steps.check.outputs.available == 'true'
        run: |
          set -e
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15)
          SCP_OPTS=(-i ~/.ssh/id_deploy -P "$SSH_PORT" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15)
          TARGET="${SSH_USER}@${HOST}"

          # 清理上次的临时文件
          ssh "${SSH_OPTS[@]}" "$TARGET" "rm -rf /tmp/experience-api-new /tmp/experience-api.service"

          # 上传应用产物 + systemd 服务文件
          scp "${SCP_OPTS[@]}" -r publish "$TARGET:/tmp/experience-api-new"
          scp "${SCP_OPTS[@]}" deploy/experience-api.service "$TARGET:/tmp/experience-api.service"

          # 停服务 → 替换文件 → 注册/重启 systemd → 放行防火墙
          ssh "${SSH_OPTS[@]}" "$TARGET" bash -s <<'REMOTE'
          set -e
          sudo rm -rf ${{ env.REMOTE_DIR }}
          sudo mkdir -p ${{ env.REMOTE_DIR }}
          sudo cp -a /tmp/experience-api-new/. ${{ env.REMOTE_DIR }}/
          sudo chmod +x ${{ env.REMOTE_DIR }}/Experience.Api
          sudo cp /tmp/experience-api.service /etc/systemd/system/experience-api.service
          sudo systemctl daemon-reload
          sudo systemctl enable experience-api
          sudo systemctl restart experience-api
          if systemctl is-active --quiet firewalld; then
            sudo firewall-cmd --permanent --add-port=${{ env.APP_PORT }}/tcp
            sudo firewall-cmd --reload
          fi
          if systemctl is-active --quiet ufw; then
            sudo ufw allow ${{ env.APP_PORT }}/tcp
          fi
          rm -rf /tmp/experience-api-new /tmp/experience-api.service
          REMOTE

      - name: Verify deployment
        if: steps.check.outputs.available == 'true'
        run: |
          curl -fsS --retry 8 --retry-delay 3 --retry-all-errors "http://${HOST}:${APP_PORT}/health"
          echo
          curl -fsS "http://${HOST}:${APP_PORT}/api/hello?name=github-actions"
          echo
