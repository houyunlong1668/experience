name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: Experience.Api.csproj
  APP_PORT: '8080'
  REMOTE_DIR: /opt/experience-api

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }} -r linux-x64

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Publish (self-contained linux-x64)
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          --configuration Release
          -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          --no-restore
          --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-publish
          path: ./publish

  deploy:
    needs: build
    # push 到 main 或手动 Run workflow（在 main 上）时部署，PR 只构建
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 使用 deploy 环境的 secrets（Settings → Environments → deploy）
    environment: deploy
    timeout-minutes: 30
    env:
      HOST: ${{ secrets.HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-publish
          path: ./publish

      - name: Check SSH config
        id: check
        run: |
          missing=""
          [ -z "$HOST" ] && missing="$missing HOST"
          [ -z "$SSH_USER" ] && missing="$missing SSH_USER"
          [ -z "$SSH_PRIVATE_KEY" ] && missing="$missing SSH_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::缺少 secrets：$missing（需位于 deploy 环境或仓库 Actions secrets，配置后重新运行）"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH key
        if: steps.check.outputs.available == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            echo "::error::SSH_PRIVATE_KEY 格式无效：需要完整的多行 OpenSSH/RSA 私钥文件内容（含 BEGIN/END 行），不能是公钥、.ppk 或字面量 \\n。"
            exit 1
          fi

      - name: Deploy to Aliyun ECS
        if: steps.check.outputs.available == 'true'
        run: |
          set -e
          # BatchMode=yes：禁止任何交互（密码/口令提示），避免 CI 中挂死
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          SCP_OPTS=(-i ~/.ssh/id_deploy -P "$SSH_PORT" -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          TARGET="${SSH_USER}@${HOST}"

          echo "::notice::连接测试 ${TARGET} ..."
          SIZE=$(du -sh publish | cut -f1)
          echo "::notice::待上传产物大小：${SIZE}（跨国链路，大文件可能需要数分钟）"

          # 清理上次的临时文件
          ssh "${SSH_OPTS[@]}" "$TARGET" "rm -rf /tmp/experience-api-new /tmp/experience-api.service"
          echo "::notice::SSH 认证成功，开始上传..."

          # 上传应用产物 + systemd 服务文件
          scp "${SCP_OPTS[@]}" -r publish "$TARGET:/tmp/experience-api-new"
          scp "${SCP_OPTS[@]}" deploy/experience-api.service "$TARGET:/tmp/experience-api.service"
          echo "::notice::上传完成，开始安装并重启服务..."

          # 停服务 → 替换文件 → 注册/重启 systemd → 放行防火墙
          ssh "${SSH_OPTS[@]}" "$TARGET" bash -s <<'REMOTE'
          set -e
          echo ">> 替换应用文件"
          sudo rm -rf ${{ env.REMOTE_DIR }}
          sudo mkdir -p ${{ env.REMOTE_DIR }}
          sudo cp -a /tmp/experience-api-new/. ${{ env.REMOTE_DIR }}/
          sudo chmod +x ${{ env.REMOTE_DIR }}/Experience.Api
          echo ">> 注册并重启 systemd 服务"
          sudo cp /tmp/experience-api.service /etc/systemd/system/experience-api.service
          sudo systemctl daemon-reload
          sudo systemctl enable experience-api
          sudo systemctl restart experience-api
          sleep 2
          systemctl is-active experience-api
          echo ">> 放行防火墙（若启用）"
          if systemctl is-active --quiet firewalld; then
            sudo firewall-cmd --permanent --add-port=${{ env.APP_PORT }}/tcp
            sudo firewall-cmd --reload
          fi
          if systemctl is-active --quiet ufw; then
            sudo ufw allow ${{ env.APP_PORT }}/tcp
          fi
          rm -rf /tmp/experience-api-new /tmp/experience-api.service
          echo ">> 远程安装完成"
          REMOTE

      - name: Verify deployment
        if: steps.check.outputs.available == 'true'
        run: |
          echo "健康检查："
          curl -fsS --retry 8 --retry-delay 3 --retry-all-errors "http://${HOST}:${APP_PORT}/health"
          echo
          curl -fsS "http://${HOST}:${APP_PORT}/api/hello?name=github-actions"
          echo
          echo "✅ 部署成功：http://${HOST}:${APP_PORT}/api/hello?name=你的名字"
