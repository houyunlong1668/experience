name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: Experience.Api.csproj
  APP_PORT: '8080'
  # ↓↓↓ 阿里云 ACR 配置（命名空间/仓库名取自 ACR 控制台）↓↓↓
  ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ACR_NAMESPACE: hou_yun_long
  IMAGE_NAME: experience

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 仓库级 secret（Settings → Secrets and variables → Actions → Repository secrets）
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ./publish

      - name: Docker build
        run: |
          IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${IMAGE_NAME}"
          echo "构建镜像：$IMAGE:${GITHUB_SHA}"
          docker build -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" .

      - name: Push to Aliyun ACR
        # push 到 main 或手动触发时推送，PR 只构建验证
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$ACR_USERNAME" ] || [ -z "$ACR_PASSWORD" ] || [ "$ACR_NAMESPACE" = "replace-me-namespace" ]; then
            echo "::warning::ACR 未配置完成（缺仓库级 secret ACR_USERNAME/ACR_PASSWORD，或 workflow 顶部 ACR_NAMESPACE 未填写），跳过镜像推送"
            exit 0
          fi
          echo "$ACR_PASSWORD" | docker login --username "$ACR_USERNAME" --password-stdin "$ACR_REGISTRY"
          IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${IMAGE_NAME}"
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
          echo "::notice::镜像已推送：$IMAGE:${GITHUB_SHA}"

  deploy:
    needs: build
    # push 到 main 或手动 Run workflow（在 main 上）时部署，PR 只构建
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # SSH 密钥位于 deploy 环境（Settings → Environments → deploy）
    environment: deploy
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
    steps:
      - name: Check config
        id: check
        run: |
          missing=""
          [ -z "$HOST" ] && missing="$missing HOST(deploy环境)"
          [ -z "$SSH_USER" ] && missing="$missing SSH_USER(deploy环境)"
          [ -z "$SSH_PRIVATE_KEY" ] && missing="$missing SSH_PRIVATE_KEY(deploy环境)"
          [ -z "$ACR_USERNAME" ] && missing="$missing ACR_USERNAME(仓库级)"
          [ -z "$ACR_PASSWORD" ] && missing="$missing ACR_PASSWORD(仓库级)"
          [ "$ACR_NAMESPACE" = "replace-me-namespace" ] && missing="$missing ACR_NAMESPACE(workflow顶部)"
          if [ -n "$missing" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::缺少配置：$missing —— 已跳过部署，补齐后重新运行即可"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH key
        if: steps.check.outputs.available == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            echo "::error::SSH_PRIVATE_KEY 格式无效：需要完整的多行 OpenSSH/RSA 私钥文件内容（含 BEGIN/END 行），不能是公钥、.ppk 或字面量 \\n。"
            exit 1
          fi

      - name: Deploy via Docker
        if: steps.check.outputs.available == 'true'
        run: |
          set -e
          # BatchMode：禁止任何交互提示，避免 CI 挂死
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          TARGET="${SSH_USER}@${HOST}"

          echo "::notice::连接测试 ${TARGET} ..."

          # 1) 确保服务器已安装 Docker（缺失则用阿里云镜像源安装）
          ssh "${SSH_OPTS[@]}" "$TARGET" bash -s <<'REMOTE_SETUP'
          set -e
          if ! command -v docker >/dev/null 2>&1; then
            echo ">> 服务器未安装 Docker，开始安装（--mirror Aliyun）"
            curl -fsSL https://get.docker.com | sudo sh -s -- --mirror Aliyun
            sudo systemctl enable --now docker
          fi
          sudo docker --version
          REMOTE_SETUP

          # 2) 登录 ACR（密码经加密通道的 stdin 传输，不进命令行参数）
          printf '%s\n' "$ACR_PASSWORD" | ssh "${SSH_OPTS[@]}" "$TARGET" \
            "sudo docker login --username '$ACR_USERNAME' --password-stdin '$ACR_REGISTRY'"
          echo "::notice::ACR 登录成功，拉取镜像并启动容器..."

          # 3) 停用旧 systemd 部署 → 拉取镜像 → 以容器方式运行
          ssh "${SSH_OPTS[@]}" "$TARGET" bash -s <<'REMOTE'
          set -e
          echo ">> 停用旧 systemd 部署（如有）"
          sudo systemctl disable --now experience-api 2>/dev/null || true
          sudo rm -rf /opt/experience-api
          echo ">> 拉取镜像（国内 ACR，首次含基础层约百 MB，之后仅增量几 MB）"
          sudo docker pull "${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo ">> 启动容器"
          sudo docker rm -f experience-api 2>/dev/null || true
          sudo docker run -d --name experience-api --restart=always \
            -p ${{ env.APP_PORT }}:8080 \
            "${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          sleep 3
          sudo docker ps --filter name=experience-api --format '{{.Names}}  {{.Status}}'
          echo ">> 容器已启动"
          REMOTE

      - name: Verify deployment
        if: steps.check.outputs.available == 'true'
        run: |
          echo "健康检查："
          curl -fsS --retry 8 --retry-delay 3 --retry-all-errors "http://${HOST}:${APP_PORT}/health"
          echo
          curl -fsS "http://${HOST}:${APP_PORT}/api/hello?name=github-actions"
          echo
          echo "✅ 部署成功：http://${HOST}:${APP_PORT}/api/hello?name=你的名字"
