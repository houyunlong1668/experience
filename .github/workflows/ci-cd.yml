name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  # ↓↓↓ 改成你在 Azure 创建的 Web App 名称（对应 https://<名称>.azurewebsites.net）↓↓↓
  AZURE_WEBAPP_NAME: experience-api
  PROJECT_PATH: Experience.Api.csproj

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-publish
          path: ./publish

  deploy:
    needs: build
    # 只在推送到 main 时部署，PR 只构建
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-publish
          path: ./publish

      - name: Check Azure credentials
        id: check
        run: |
          if [ -z "$AZURE_CREDENTIALS" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 AZURE_CREDENTIALS secret，已跳过 Azure 部署。配置后重新运行本工作流即可。"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure Login
        if: steps.check.outputs.available == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        if: steps.check.outputs.available == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish

      - name: Azure Logout
        if: steps.check.outputs.available == 'true'
        run: az logout
